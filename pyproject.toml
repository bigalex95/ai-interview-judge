[project]
name = "ai-interview-judge"
version = "0.1.0"
description = "Video interview analysis: slide detection (C++/OpenCV), speech transcription (Whisper), slide OCR (PaddleOCR) and LLM-based answer evaluation."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.128.0",
    "numpy>=1.21.0,<2.0.0",
    "opencv-contrib-python>=4.11.0.86",
    "uvicorn>=0.40.0",
    # --- New ML Dependencies ---
    "faster-whisper>=1.0.0", # ASR (Audio-to-Text) - more efficient than openai-whisper
    "paddlepaddle>=2.6.0", # OCR engine (CPU version)
    "paddleocr>=2.7.0", # The OCR library itself
    "moviepy>=1.0.3,<2.0.0", # For working with audio tracks
    "setuptools>=68.0.0", # Often needed to build older packages
    "python-multipart>=0.0.21",
    # --- New LLM Dependencies ---
    "google-generativeai>=0.8.3",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.14.10"]
