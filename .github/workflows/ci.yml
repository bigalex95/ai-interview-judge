name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libopencv-dev python3-dev

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Only the packages imported by the tests (no PaddleOCR/torch, which are
      # heavy and not needed here).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "numpy<2" opencv-python-headless faster-whisper \
            google-generativeai python-dotenv "moviepy<2"

      - name: Run tests
        run: python -m pytest tests/python -q
